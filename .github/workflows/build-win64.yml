name: Build mGBA Windows x64

on:
  workflow_dispatch:

  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-win64:
    name: Build Windows x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show source revision
        run: |
          set -euxo pipefail

          git rev-parse HEAD
          git branch --show-current

      - name: Build with official mGBA Windows x64 Docker image
        run: |
          set -euxo pipefail

          # The official mGBA Windows image uses a different UID
          # from the GitHub Actions runner. Running it as root allows
          # it to create build-win64 inside the checked-out repository.
          docker run --rm \
            --user 0:0 \
            -v "$PWD:/home/mgba/src" \
            -e MAKEFLAGS="-j$(nproc)" \
            mgba/windows:w64

      - name: Verify Windows build
        run: |
          set -euxo pipefail

          test -d build-win64

          echo "=== Build output ==="
          find build-win64 -maxdepth 3 -type f | sort | head -300

          echo "=== Executables ==="
          find build-win64 -type f -iname '*.exe' -print

          MGBA_EXE="$(find build-win64 -type f \
            \( -iname 'mGBA.exe' -o -iname 'mgba.exe' \) \
            -print -quit)"

          test -n "$MGBA_EXE"

          echo "mGBA executable:"
          echo "$MGBA_EXE"

          echo "=== PE check ==="
          file "$MGBA_EXE"

          file "$MGBA_EXE" | grep -Eiq \
            'PE32\+.*x86-64|Windows.*x86-64|PE32\+.*AMD64'

      - name: Package complete Windows build
        run: |
          set -euxo pipefail

          rm -rf artifact
          mkdir -p artifact

          # Package the complete build tree.
          # This keeps mGBA.exe together with its required DLLs
          # and runtime files.
          cd build-win64

          zip -9 -r ../artifact/mGBA-windows-x64.zip .

          cd ..

          echo "=== Package ==="
          ls -lh artifact/mGBA-windows-x64.zip

          echo "=== Package contents ==="
          unzip -l artifact/mGBA-windows-x64.zip | head -100

          test -s artifact/mGBA-windows-x64.zip

      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: mGBA-Windows-x64
          path: artifact/mGBA-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
