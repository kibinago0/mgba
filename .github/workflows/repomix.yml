name: Repomix - mGBA Source Code to Google Drive

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repomix:
    runs-on: ubuntu-latest

    steps:
      # ========================================
      # 1. mGBAを取得
      # ========================================
      - name: Checkout mGBA
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ========================================
      # 2. Node.js
      # ========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ========================================
      # 3. Repomix
      # ========================================
      - name: Run Repomix
        run: |
          npx repomix@1.18.0 \
            --style markdown \
            --remove-empty-lines \
            --output-show-line-numbers \
            --include "**/*.c,**/*.h,**/*.cc,**/*.cpp,**/*.cxx,**/*.hh,**/*.hpp,**/*.hxx,**/*.S,**/*.s,**/*.asm,**/*.inc,**/*.inl,**/*.ixx,**/CMakeLists.txt,**/*.cmake"

      # ========================================
      # 4. NotebookLM用に分割
      # ========================================
      - name: Split Repomix output
        run: |
          python <<'PY'
          from pathlib import Path

          source = Path("repomix-output.md")
          text = source.read_text(encoding="utf-8")

          # NotebookLM用に余裕を持たせる
          # 1ファイル最大300,000文字
          MAX_CHARS = 300000

          lines = text.splitlines(keepends=True)

          parts = []
          current = ""

          for line in lines:
              if len(current) + len(line) > MAX_CHARS:
                  if current:
                      parts.append(current)
                      current = ""

              current += line

          if current:
              parts.append(current)

          for i, part in enumerate(parts, 1):
              filename = f"mGBA-repomix-{i:02d}.md"

              Path(filename).write_text(
                  part,
                  encoding="utf-8"
              )

              print(
                  f"{filename}: "
                  f"{len(part):,} characters"
              )

          print(f"Total files: {len(parts)}")
          PY

      # ========================================
      # 5. Google Drive APIライブラリ
      # ========================================
      - name: Install Google Drive libraries
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2

      # ========================================
      # 6. Google Driveへアップロード
      # ========================================
      - name: Upload to Google Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          python <<'PY'
          import os
          from pathlib import Path

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          # ========================================
          # OAuth
          # ========================================

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["GOOGLE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["GOOGLE_CLIENT_ID"],
              client_secret=os.environ["GOOGLE_CLIENT_SECRET"],
              scopes=[
                  "https://www.googleapis.com/auth/drive.file"
              ],
          )

          service = build(
              "drive",
              "v3",
              credentials=credentials,
          )

          folder_id = os.environ["GOOGLE_DRIVE_FOLDER_ID"]

          # ========================================
          # 分割されたMarkdownを取得
          # ========================================

          files_to_upload = sorted(
              Path(".").glob("mGBA-repomix-*.md")
          )

          if not files_to_upload:
              raise RuntimeError(
                  "No split Repomix files found."
              )

          print(
              f"Found {len(files_to_upload)} "
              f"Repomix files."
          )

          # ========================================
          # Google Driveへアップロード / 更新
          # ========================================

          current_names = set()

          for local_file in files_to_upload:

              file_name = local_file.name
              current_names.add(file_name)

              print()
              print(
                  f"Processing: {file_name}"
              )

              query = (
                  f"'{folder_id}' in parents "
                  f"and name = '{file_name}' "
                  "and trashed = false"
              )

              result = service.files().list(
                  q=query,
                  spaces="drive",
                  fields="files(id,name)",
              ).execute()

              existing_files = result.get(
                  "files",
                  []
              )

              media = MediaFileUpload(
                  str(local_file),
                  mimetype="text/markdown",
                  resumable=True,
              )

              if existing_files:

                  file_id = existing_files[0]["id"]

                  service.files().update(
                      fileId=file_id,
                      media_body=media,
                  ).execute()

                  print(
                      f"Updated: {file_name}"
                  )

              else:

                  metadata = {
                      "name": file_name,
                      "parents": [folder_id],
                  }

                  created = service.files().create(
                      body=metadata,
                      media_body=media,
                      fields="id,name",
                  ).execute()

                  print(
                      f"Created: "
                      f"{created['name']}"
                  )

          # ========================================
          # 古い分割ファイルを削除
          # ========================================
          #
          # 以前は10ファイルあったが、
          # 今回は8ファイルになった場合などに
          # 余ったファイルをDriveから削除する。
          # ========================================

          query = (
              f"'{folder_id}' in parents "
              "and trashed = false"
          )

          result = service.files().list(
              q=query,
              spaces="drive",
              fields="files(id,name)",
              pageSize=1000,
          ).execute()

          drive_files = result.get(
              "files",
              []
          )

          for drive_file in drive_files:

              name = drive_file["name"]

              if (
                  name.startswith("mGBA-repomix-")
                  and name.endswith(".md")
                  and name not in current_names
              ):

                  print(
                      f"Deleting old file: "
                      f"{name}"
                  )

                  service.files().delete(
                      fileId=drive_file["id"]
                  ).execute()

          print()
          print(
              "Google Drive synchronization "
              "completed successfully."
          )
          PY

      # ========================================
      # 7. GitHub Actions Artifactにも保存
      # ========================================
      - name: Upload Repomix artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mGBA-Source-Code-Repomix
          path: mGBA-repomix-*.md
          if-no-files-found: error