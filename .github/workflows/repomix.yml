name: Repomix - mGBA Core Source to Google Drive

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repomix:
    runs-on: ubuntu-latest

    steps:
      # ========================================
      # 1. Checkout
      # ========================================
      - name: Checkout mGBA
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ========================================
      # 2. Node.js
      # ========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ========================================
      # 3. Repomix
      #
      # src / include のコードだけ
      # ========================================
      - name: Run Repomix
        run: |
          npx repomix@1.18.0 \
            --style markdown \
            --remove-empty-lines \
            --output-show-line-numbers \
            --include "src/**/*.c,src/**/*.h,src/**/*.cc,src/**/*.cpp,src/**/*.cxx,src/**/*.hh,src/**/*.hpp,src/**/*.hxx,src/**/*.S,src/**/*.s,src/**/*.asm,src/**/*.inc,src/**/*.inl,src/**/*.ixx,include/**/*.c,include/**/*.h,include/**/*.cc,include/**/*.cpp,include/**/*.cxx,include/**/*.hh,include/**/*.hpp,include/**/*.hxx,include/**/*.S,include/**/*.s,include/**/*.asm,include/**/*.inc,include/**/*.inl,include/**/*.ixx" \
            --ignore "src/third-party/**,src/test/**,src/tests/**,src/**/test/**,src/**/tests/**,include/third-party/**,include/test/**,include/tests/**"

      # ========================================
      # 4. NotebookLM用に分割
      # ========================================
      - name: Split Repomix output
        run: |
          python <<'PY'
          from pathlib import Path

          source = Path("repomix-output.md")
          text = source.read_text(encoding="utf-8")

          # NotebookLM用。
          # 1ファイル300,000文字以下。
          MAX_CHARS = 300000

          parts = []
          current = ""

          for line in text.splitlines(keepends=True):
              if len(current) + len(line) > MAX_CHARS:
                  if current:
                      parts.append(current)
                      current = ""

              current += line

          if current:
              parts.append(current)

          for i, part in enumerate(parts, 1):
              filename = f"mGBA-repomix-{i:02d}.md"

              Path(filename).write_text(
                  part,
                  encoding="utf-8"
              )

              print(
                  f"{filename}: "
                  f"{len(part):,} characters"
              )

          print(f"Total files: {len(parts)}")
          PY

      # ========================================
      # 5. Google Drive API
      # ========================================
      - name: Install Google Drive libraries
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2

      # ========================================
      # 6. Google Driveへ同期
      # ========================================
      - name: Upload to Google Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          python <<'PY'
          import os
          from pathlib import Path

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["GOOGLE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["GOOGLE_CLIENT_ID"],
              client_secret=os.environ["GOOGLE_CLIENT_SECRET"],
              scopes=[
                  "https://www.googleapis.com/auth/drive.file"
              ],
          )

          service = build(
              "drive",
              "v3",
              credentials=credentials,
          )

          folder_id = os.environ["GOOGLE_DRIVE_FOLDER_ID"]

          local_files = sorted(
              Path(".").glob("mGBA-repomix-*.md")
          )

          if not local_files:
              raise RuntimeError(
                  "No Repomix files were generated."
              )

          current_names = set()

          # ========================================
          # Upload / Update
          # ========================================

          for local_file in local_files:

              file_name = local_file.name
              current_names.add(file_name)

              print(f"Processing: {file_name}")

              query = (
                  f"'{folder_id}' in parents "
                  f"and name = '{file_name}' "
                  "and trashed = false"
              )

              result = service.files().list(
                  q=query,
                  spaces="drive",
                  fields="files(id,name)",
              ).execute()

              existing = result.get("files", [])

              media = MediaFileUpload(
                  str(local_file),
                  mimetype="text/markdown",
                  resumable=True,
              )

              if existing:

                  file_id = existing[0]["id"]

                  service.files().update(
                      fileId=file_id,
                      media_body=media,
                  ).execute()

                  print(f"Updated: {file_name}")

              else:

                  metadata = {
                      "name": file_name,
                      "parents": [folder_id],
                  }

                  created = service.files().create(
                      body=metadata,
                      media_body=media,
                      fields="id,name",
                  ).execute()

                  print(
                      f"Created: "
                      f"{created['name']}"
                  )

          # ========================================
          # 古い分割ファイルを削除
          # ========================================

          result = service.files().list(
              q=(
                  f"'{folder_id}' in parents "
                  "and trashed = false"
              ),
              spaces="drive",
              fields="files(id,name)",
              pageSize=1000,
          ).execute()

          for drive_file in result.get("files", []):

              name = drive_file["name"]

              if (
                  name.startswith("mGBA-repomix-")
                  and name.endswith(".md")
                  and name not in current_names
              ):

                  print(
                      f"Deleting old file: {name}"
                  )

                  service.files().delete(
                      fileId=drive_file["id"]
                  ).execute()

          print(
              "Google Drive synchronization "
              "completed."
          )
          PY

      # ========================================
      # 7. GitHub Artifact
      # ========================================
      - name: Upload Repomix artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mGBA-Core-Source-Repomix
          path: mGBA-repomix-*.md
          if-no-files-found: error