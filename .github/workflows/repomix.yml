name: Repomix - mGBA Source Code to Google Drive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repomix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mGBA
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Repomix
        run: |
          npx repomix@1.18.0 \
            --style markdown \
            --remove-empty-lines \
            --output-show-line-numbers \
            --include "**/*.c,**/*.h,**/*.cc,**/*.cpp,**/*.cxx,**/*.hh,**/*.hpp,**/*.hxx,**/*.S,**/*.s,**/*.asm,**/*.inc,**/*.inl,**/*.ixx,**/CMakeLists.txt,**/*.cmake"

      - name: Install Google Drive libraries
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2

      - name: Upload Repomix to Google Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          python <<'PY'
          import os

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["GOOGLE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["GOOGLE_CLIENT_ID"],
              client_secret=os.environ["GOOGLE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/drive.file"],
          )

          service = build(
              "drive",
              "v3",
              credentials=credentials,
          )

          folder_id = os.environ["GOOGLE_DRIVE_FOLDER_ID"]
          file_name = "mGBA-repomix.md"

          query = (
              f"'{folder_id}' in parents "
              "and name = 'mGBA-repomix.md' "
              "and trashed = false"
          )

          result = service.files().list(
              q=query,
              spaces="drive",
              fields="files(id,name)",
          ).execute()

          media = MediaFileUpload(
              "repomix-output.md",
              mimetype="text/markdown",
              resumable=True,
          )

          files = result.get("files", [])

          if files:
              file_id = files[0]["id"]

              service.files().update(
                  fileId=file_id,
                  media_body=media,
              ).execute()

              print("Updated existing Google Drive file.")

          else:
              metadata = {
                  "name": file_name,
                  "parents": [folder_id],
              }

              created = service.files().create(
                  body=metadata,
                  media_body=media,
                  fields="id,name",
              ).execute()

              print(
                  f"Created Google Drive file: "
                  f"{created['name']} ({created['id']})"
              )
          PY

      - name: Upload GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mGBA-Source-Code-Repomix
          path: repomix-output.md
          if-no-files-found: error